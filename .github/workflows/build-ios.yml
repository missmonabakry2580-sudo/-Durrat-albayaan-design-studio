# Builds أمين's native iPhone app (ios/ — see ios/project.yml's header)
# and, when Mona's App Store Connect secrets are present, archives, signs
# via Apple's cloud signing (-allowProvisioningUpdates with her ASC API
# key — no certificates in the repo, ever) and uploads to TestFlight.
#
# Two-stage on purpose: the unsigned compile check always runs, so Swift
# errors surface on every push even before the secrets exist; the
# sign+upload stage self-skips (with a plain notice, not a failure) until
# all three secrets are configured:
#   APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID /
#   APP_STORE_CONNECT_KEY_P8
name: Build Amin (iOS)

on:
  push:
    branches: [claude/amin-project-6wwufr]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          ls -la Amin.xcodeproj

      - name: Compile check (unsigned)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild build \
            -project Amin.xcodeproj \
            -scheme Amin \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

      - name: Check for App Store Connect secrets
        id: gate
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "All three App Store Connect secrets present — proceeding to TestFlight."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets not configured yet — compile check only (this is fine, not a failure)."
          fi

      - name: Write the ASC API key
        if: steps.gate.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        # The paste survived every canonicalization attempt because it is
        # not the key: the base64 body arrived as non-ASCII Unicode
        # lookalikes that even NFKC leaves alone (some clipboard path on
        # the phone restyled the letters; the ASCII header lines survived).
        # So: try the plain extraction first, and when too little base64
        # remains, de-confuse the body with Unicode's own confusables
        # table, mapping each non-ASCII char back to its ASCII prototype.
        # Correctness is not guessed: the decoded DER must match the
        # SHA-256 of the real AuthKey (a hash of a 256-bit random key
        # reveals nothing and proves byte-exact recovery).
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          python3 - <<'PY'
          import os, re, sys, textwrap, base64, unicodedata, hashlib, collections, urllib.request

          REAL_DER_SHA256 = "ada007f53d65a150be2e245681fe4914a8a786172f778386beb16463ec062aa8"
          raw = os.environ["KEY_P8"]

          def extract(s):
              s = unicodedata.normalize("NFKC", s)
              s = re.sub(r"-{3,}[^-]*-{3,}", "", s)
              s = re.sub(r"(?im)^.*(BEGIN|END).*$", "", s)
              return re.sub(r"[^A-Za-z0-9+/=]", "", s)

          def histogram(s):
              # Safe to print: 256-codepoint block counts only — no char
              # identities, no ordering, nothing key-shaped.
              return dict(collections.Counter(
                  "U+%04Xxx" % (ord(c) >> 8 << 8) for c in s if ord(c) > 127))

          b64 = extract(raw)
          print("plain extraction kept", len(b64), "base64 chars of", len(raw), "input chars")

          if len(b64) < 150:
              print("too short — de-confusing; non-ASCII blocks in the paste:", histogram(raw))
              table = {}
              data = urllib.request.urlopen(
                  "https://www.unicode.org/Public/security/latest/confusables.txt",
                  timeout=60).read().decode("utf-8")
              for line in data.splitlines():
                  line = line.split("#")[0].strip()
                  parts = [p.strip() for p in line.split(";")]
                  if len(parts) < 2 or len(parts[0].split()) != 1:
                      continue
                  try:
                      src = chr(int(parts[0], 16))
                      dst = "".join(chr(int(c, 16)) for c in parts[1].split())
                  except ValueError:
                      continue
                  table[src] = dst
              fixed = "".join(table.get(c, c) if ord(c) > 127 else c for c in raw)
              b64 = extract(fixed)
              print("after confusables mapping:", len(b64), "base64 chars; leftover blocks:", histogram(fixed))

          try:
              der = base64.b64decode(b64, validate=True)
          except Exception as e:
              sys.exit("base64 decode failed: %s (had %d chars)" % (e, len(b64)))
          got = hashlib.sha256(der).hexdigest()
          print("der:", len(der), "bytes; sha256:", got[:16], "…")
          assert got == REAL_DER_SHA256, "recovered key does not match the real AuthKey — refusing to continue"
          print("recovered key verified byte-for-byte against the real AuthKey ✓")

          b64 = base64.b64encode(der).decode()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(b64, 64)) + "\n-----END PRIVATE KEY-----\n"
          path = os.path.expanduser("~/private_keys/AuthKey_" + os.environ["KEY_ID"] + ".p8")
          open(path, "w").write(pem)
          PY
          ls -la "$HOME/private_keys/"
          FILE="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          echo "sh sees: $(wc -c < "$FILE") bytes; sha: $(shasum -a 256 "$FILE" | cut -c1-16)"
          head -1 "$FILE"
          openssl pkey -in "$FILE" -noout && echo "openssl: key parses OK in CI"

      - name: Archive (cloud signing)
        if: steps.gate.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild archive \
            -project Amin.xcodeproj \
            -scheme Amin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Amin.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME"/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tail -40

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cd ios
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Amin.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME"/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -40
