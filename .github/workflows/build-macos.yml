name: Build Amin (macOS)

# Builds a ready-to-download macOS app for Mona so she never has to install
# Node/Rust/Xcode tools herself — every push to the Amin branch (and manual
# runs) produces a fresh universal (Intel + Apple Silicon) .dmg attached to
# the "amin-preview" GitHub Release. See docs/ARCHITECTURE.md.
on:
  push:
    branches: [claude/amin-project-6wwufr]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # Compiles macos/transcriber/main.swift (Speech/AVFoundation push-to-
      # talk helper — see src-tauri/src/voice.rs) as a universal binary and
      # places it where tauri.conf.json's bundle.resources expects it. This
      # Swift code has never been compiled before it reaches this runner —
      # if it fails, a placeholder that reports a clear in-app error is
      # bundled instead, so a Swift build problem never breaks Amin's whole
      # release. Check this step's log first if voice doesn't work.
      - name: Build the voice transcriber helper
        run: |
          cd macos/transcriber
          DEST="$GITHUB_WORKSPACE/src-tauri/amin-transcriber"
          if swiftc -O -target arm64-apple-macosx13.0 main.swift -o amin-transcriber-arm64 \
            && swiftc -O -target x86_64-apple-macosx13.0 main.swift -o amin-transcriber-x86_64 \
            && lipo -create amin-transcriber-arm64 amin-transcriber-x86_64 -output "$DEST"; then
            chmod +x "$DEST"
            echo "Voice transcriber compiled successfully (universal binary)."
          else
            echo "::warning::Voice transcriber failed to compile — bundling a placeholder instead of failing the whole build. Push-to-talk will report a clear error until this is fixed."
            printf '%s\n' '#!/bin/sh' 'echo "{\"type\":\"error\",\"message\":\"the voice transcriber failed to build in CI - see the build-macos workflow logs\"}"' > "$DEST"
            chmod +x "$DEST"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: amin-preview
          releaseName: "أمين — نسخة تجريبية (Preview)"
          releaseBody: |
            بُنيت تلقائيًا من فرع claude/amin-project-6wwufr — آخر تحديث: ${{ github.sha }}

            هذا التطبيق غير موقّع بشهادة مطوّر آبل (شخصي، غير موزّع عبر App Store)، فعند فتحه أول مرة سيظهر تحذير أمان من macOS. الحل:
            كليك يمين (أو Control+كليك) على أيقونة "Amin" ثم اختاري "Open" من القائمة، وأكّدي "Open" في مربع التحذير — مرة واحدة فقط، بعدها يفتح عادي.
            أو من: إعدادات النظام ← الخصوصية والأمان ← وابحثي عن رسالة "Amin was blocked" واضغطي "Open Anyway".
          releaseDraft: false
          prerelease: true
