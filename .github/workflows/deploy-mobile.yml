# Publishes mobile/ (أمين نسخة الهاتف — a self-contained static web app,
# see mobile/index.html's header comment) so Mona can open it on her phone
# at
#   https://missmonabakry2580-sudo.github.io/-Durrat-albayaan-design-studio/
# and add it to her home screen.
#
# REWORKED 2026-08-29: the first version used actions/configure-pages with
# enablement: true, which failed with "Resource not accessible by
# integration" — GITHUB_TOKEN cannot administratively enable Pages on this
# repo, and no secret exists that can. This version publishes the classic
# way instead: force-pushing mobile/ as the root of a `gh-pages` branch,
# which GitHub auto-serves as Pages for public repos without any
# administrative API call. contents: write is a permission GITHUB_TOKEN
# genuinely has.
name: Deploy Amin Mobile (GitHub Pages)

on:
  push:
    branches: [claude/amin-project-6wwufr]
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish mobile/ to the gh-pages branch
        run: |
          set -euo pipefail
          cd mobile
          touch .nojekyll
          git init -b gh-pages
          git add -A
          git -c user.name="amin-deploy" -c user.email="actions@github.com" \
            commit -m "Deploy Amin Mobile from ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
