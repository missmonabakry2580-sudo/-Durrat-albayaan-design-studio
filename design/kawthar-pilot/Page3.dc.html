<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marhey:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  a { color: #000; }
  .page {
    width: 794px; height: 1123px; position: relative;
    background: #ffffff;
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    overflow: hidden;
    color: #000;
  }
  .border-outer { position: absolute; inset: 14px; border: 4px solid #111; border-radius: 34px; pointer-events: none; }
  .border-inner { position: absolute; inset: 23px; border: 2px dashed #111; border-radius: 26px; pointer-events: none; }

  .header { position: absolute; top: 30px; left: 40px; right: 40px; height: 150px; }
  .title-wrap { text-align: center; }
  .title { font-family: 'Marhey', sans-serif; font-weight: 700; font-size: 46px; color: #111; margin: 0; }
  .banner-wrap { display: flex; justify-content: center; margin-top: 6px; }
  .banner { border: 2px solid #111; border-radius: 999px; padding: 8px 26px; font-weight: 700; font-size: 18px; color:#111; }
  .caption { text-align:center; font-weight:700; font-size:17px; margin-top:10px; }
  .bird-wrap { position: absolute; top: 0px; left: 0px; width: 110px; height: 80px; }
  .lantern-wrap { position: absolute; top: -4px; right: 26px; width: 60px; height: 100px; }
  .moon-wrap { position: absolute; top: 2px; right: 94px; width: 40px; height: 40px; }

  .content { position: absolute; top: 250px; left: 40px; width: 714px; height: 700px; display:flex; gap: 18px; justify-content:space-between; }
  .scene { width: 226px; }
  .scene-frame { border: 3px solid #111; border-radius: 24px; height: 300px; display:flex; align-items:center; justify-content:center; position:relative; }
  .num-badge { position:absolute; top:-20px; width:40px; height:40px; border-radius:50%; border:3px solid #111; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
  .scene-cap { text-align:center; font-weight:800; font-size:16px; margin-top:12px; }

  .footer { position: absolute; bottom: 40px; left: 40px; right: 40px; }
  .footer-row1 { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .pill { border: 2px solid #111; border-radius: 999px; padding: 8px 20px; font-weight: 700; font-size: 15px; color: #111; white-space: nowrap; }
  .stars-row { display: flex; gap: 6px; align-items: center; }
  .footer-row2 { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; font-weight: 700; font-size: 16px; color: #111; }
</style>
</helmet>

<div class="page">
  <div class="border-outer"></div>
  <div class="border-inner"></div>

  <div class="header">
    <svg class="bird-wrap" viewBox="0 0 110 80" fill="none" stroke="#111" stroke-width="2">
      <path d="M3 44 Q30 30 66 34 Q88 36 106 22" stroke-linecap="round" fill="none"/>
      <g transform="translate(40 14)">
        <ellipse cx="16" cy="18" rx="14" ry="12" fill="none"/>
        <circle cx="25" cy="10" r="8" fill="none"/>
        <path d="M31 9 L38 10 L31 12 Z" fill="none"/>
        <circle cx="27" cy="8" r="1.2" fill="#111" stroke="none"/>
      </g>
    </svg>
    <svg class="moon-wrap" viewBox="0 0 40 40" fill="none" stroke="#111" stroke-width="2"><path d="M25 3 A15 15 0 1 0 25 37 A12 12 0 1 1 25 3 Z"/></svg>
    <svg class="lantern-wrap" viewBox="0 0 60 100" fill="none" stroke="#111" stroke-width="2">
      <line x1="30" y1="0" x2="30" y2="18"/>
      <path d="M14 28 Q30 18 46 28 L42 70 Q30 78 18 70 Z"/>
      <path d="M14 72 Q30 64 46 72 L30 84 Z"/>
    </svg>
    <div class="title-wrap">
      <h1 class="title">سورة الكوثر</h1>
      <div class="banner-wrap"><div class="banner">صفحة التلوين</div></div>
    </div>
    <div class="caption">ألوّن ما تعلمته من سورة الكوثر</div>
  </div>

  <div class="content">
    <!-- Scene 1 -->
    <div class="scene">
      <div class="scene-frame">
        <div class="num-badge">١</div>
        <svg width="180" height="150" viewBox="0 0 180 150" fill="none" stroke="#111" stroke-width="2.5">
          <path d="M6 120 Q45 92 90 112 Q135 132 174 100"/>
          <path d="M14 108 Q50 70 96 96 Q130 118 168 84" stroke-width="3"/>
          <circle cx="46" cy="26" r="14"/>
          <path d="M46 4v8M46 40v8M24 26h8M60 26h8M31 11l6 6M55 11l-6 6M31 41l6-6M55 41l-6 6"/>
          <path d="M100 22 Q104 14 112 18 Q108 26 100 22Z"/>
          <path d="M140 30 Q144 22 152 26 Q148 34 140 30Z"/>
        </svg>
      </div>
      <div class="scene-cap">١ — نهر الكوثر</div>
    </div>

    <!-- Scene 2 -->
    <div class="scene">
      <div class="scene-frame">
        <div class="num-badge">٢</div>
        <svg width="170" height="150" viewBox="0 0 170 150" fill="none" stroke="#111" stroke-width="2.5">
          <g transform="translate(20 6)">
            <path d="M18 40 Q8 60 18 80"/>
            <path d="M32 40 Q42 60 32 80"/>
            <path d="M8 80 Q25 96 42 80 L40 122 L10 122 Z"/>
            <circle cx="25" cy="22" r="16"/>
            <path d="M8 14 Q25 -4 42 14"/>
          </g>
          <g transform="translate(96 62)">
            <ellipse cx="26" cy="38" rx="24" ry="18"/>
            <circle cx="10" cy="20" r="9"/>
            <path d="M4 14 L2 4M18 14 L20 4"/>
            <circle cx="7" cy="21" r="1" fill="#111"/>
            <circle cx="13" cy="21" r="1" fill="#111"/>
            <path d="M16 52 L20 60M36 52 L32 60"/>
          </g>
        </svg>
      </div>
      <div class="scene-cap">٢ — نشكر ونصلّي</div>
    </div>

    <!-- Scene 3 -->
    <div class="scene">
      <div class="scene-frame">
        <div class="num-badge">٣</div>
        <svg width="170" height="150" viewBox="0 0 170 150" fill="none" stroke="#111" stroke-width="2.5">
          <path d="M46 130 V40"/>
          <ellipse cx="26" cy="52" rx="14" ry="8" transform="rotate(-30 26 52)"/>
          <ellipse cx="66" cy="46" rx="14" ry="8" transform="rotate(25 66 46)"/>
          <ellipse cx="30" cy="76" rx="13" ry="7" transform="rotate(-25 30 76)"/>
          <ellipse cx="62" cy="74" rx="13" ry="7" transform="rotate(20 62 74)"/>
          <circle cx="46" cy="24" r="7"/>
          <path d="M132 130 V78"/>
          <path d="M132 96 L118 86"/>
          <ellipse cx="112" cy="102" rx="9" ry="5" transform="rotate(30 112 102)"/>
        </svg>
      </div>
      <div class="scene-cap">٣ — لا تكن كالأبتر</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-row1">
      <div class="pill">الروضة - التمهيدي</div>
      <div class="pill" style="display:flex; align-items:center; gap:8px;">
        لوّن نجمة كلما حفظت وأتعلمت
        <span class="stars-row">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 1l2.9 7.2L22 11l-6 5 1.8 8-5.8-4.4L6.2 24 8 16 2 11l7.1-2.8Z" fill="none" stroke="#111" stroke-width="1.6"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 1l2.9 7.2L22 11l-6 5 1.8 8-5.8-4.4L6.2 24 8 16 2 11l7.1-2.8Z" fill="none" stroke="#111" stroke-width="1.6"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 1l2.9 7.2L22 11l-6 5 1.8 8-5.8-4.4L6.2 24 8 16 2 11l7.1-2.8Z" fill="none" stroke="#111" stroke-width="1.6"/></svg>
        </span>
      </div>
    </div>
    <div class="footer-row2"><span>﴾</span> مدرسة درة البيان الخاصة <span>﴿</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
